name: Build Molecula installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Molecula source
        run: unzip -q Molecula-source.zip -d source
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal Mac targets
        working-directory: source
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test Mac source
        working-directory: source
        run: cargo test --locked
      - name: Build Apple Silicon and Intel apps
        working-directory: source
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal Mac app
        working-directory: source
        run: bash scripts/package_macos.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: molecula-macos
          path: source/dist/Molecula-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Molecula source
        shell: pwsh
        run: Expand-Archive -Path Molecula-source.zip -DestinationPath source
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup and 7-Zip
        run: choco install innosetup 7zip --no-progress -y
      - name: Stage Mesa software OpenGL runtime and notices
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $mesaRoot | Out-Null
          & 7z.exe x $archive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "Could not extract Mesa OpenGL runtime" }
          $mesaDll = Get-ChildItem -Path $mesaRoot -Recurse -File | Where-Object { $_.Name -eq "opengl32.dll" -and $_.FullName -match "(?i)x64" } | Select-Object -First 1
          if (-not $mesaDll) { throw "Mesa x64 opengl32.dll was not found" }
          $stage = Join-Path $PWD "source/dist/windows/mesa"
          $notices = Join-Path $PWD "source/dist/windows/mesa-notices"
          New-Item -ItemType Directory -Force -Path $stage, $notices | Out-Null
          $dlls = Get-ChildItem -Path $mesaDll.DirectoryName -Filter "*.dll" -File
          if (-not ($dlls | Where-Object { $_.Name -eq "opengl32.dll" })) { throw "Mesa OpenGL loader is missing" }
          Copy-Item $dlls.FullName $stage -Force
          $licenseUrl = "https://raw.githubusercontent.com/pal1000/mesa-dist-win/26.2.5/LICENSE"
          Invoke-WebRequest -Uri $licenseUrl -OutFile (Join-Path $notices "mesa-dist-win-LICENSE.txt")
          $license = Get-Content (Join-Path $notices "mesa-dist-win-LICENSE.txt") -Raw
          if ($license -notmatch "MIT License") { throw "Mesa distribution license notice could not be verified" }
          @"
          Molecula bundles Mesa 3D software OpenGL runtime 26.2.5 from pal1000/mesa-dist-win.
          Upstream project: https://github.com/pal1000/mesa-dist-win
          Release: https://github.com/pal1000/mesa-dist-win/releases/tag/26.2.5
          The upstream MIT license is included in this directory.
          The application uses Mesa llvmpipe CPU rendering on Windows for compatibility.
          "@ | Set-Content (Join-Path $notices "Molecula-Mesa-notice.txt")
          Write-Host "Staged Mesa runtime DLLs: $($dlls.Count)"
      - name: Build and test Windows installer
        shell: pwsh
        working-directory: source
        run: .\scripts\package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: molecula-windows
          path: source/dist/windows/Molecula-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Install and launch packaged app in Windows VM
        shell: pwsh
        working-directory: source
        run: |
          $installer = (Resolve-Path ".\dist\windows\Molecula-Windows-Setup.exe").Path
          $setup = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $appPath = Join-Path $env:LOCALAPPDATA "Programs\Molecula\Molecula.exe"
          if (-not (Test-Path $appPath)) { throw "Installed app not found at $appPath" }
          if (-not (Test-Path (Join-Path (Split-Path $appPath) "opengl32.dll"))) { throw "Installer did not include Mesa opengl32.dll" }
          $logPath = Join-Path $env:LOCALAPPDATA "Molecula\startup.log"
          if (-not (Test-Path $logPath)) { throw "Installer did not create the startup log" }
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:LIBGL_ALWAYS_SOFTWARE = "1"
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { Get-Content $logPath | Write-Host; throw "Packaged app exited during Windows VM smoke test" }
          if ($app.MainWindowHandle -eq 0) { Stop-Process -Id $app.Id -Force; Get-Content $logPath | Write-Host; throw "Molecula did not create a main window" }
          Stop-Process -Id $app.Id -Force
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Mac and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Molecula $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/Molecula-macOS-universal.dmg dist/Molecula-Windows-Setup.exe --clobber
