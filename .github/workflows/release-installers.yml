name: Build Molecula installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source
        shell: pwsh
        run: Expand-Archive -Path Molecula-source.zip -DestinationPath source
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup and 7-Zip
        run: choco install innosetup 7zip --no-progress -y
      - name: Build and test Windows installer
        shell: pwsh
        working-directory: source
        run: .\scripts\package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: molecula-windows
          path: source/dist/windows/Molecula-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Mesa software OpenGL for VM
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.7/mesa3d-26.2.7-release-msvc.7z" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $mesaRoot | Out-Null
          & 7z.exe x $archive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract Mesa OpenGL test driver" }
      - name: Install and launch app in Windows VM
        shell: pwsh
        working-directory: source
        run: |
          $installer = (Resolve-Path ".\dist\windows\Molecula-Windows-Setup.exe").Path
          $setup = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $appPath = Join-Path $env:LOCALAPPDATA "Programs\Molecula\Molecula.exe"
          if (-not (Test-Path $appPath)) { throw "Installed app not found at $appPath" }
          $logPath = Join-Path $env:LOCALAPPDATA "Molecula\startup.log"
          Remove-Item $logPath -ErrorAction SilentlyContinue
                    $mesaFiles = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "mesa") -Filter opengl32.dll -File -Recurse
          $mesaFiles | ForEach-Object { Write-Host "Mesa OpenGL runtime found at $($_.FullName)" }
          $mesaDll = $mesaFiles | Where-Object { $_.Directory.Name -eq "x64" } | Select-Object -First 1
          if (-not $mesaDll) { throw "Mesa x64 OpenGL runtime not found; see the candidate paths above" }
          Copy-Item (Join-Path $mesaDll.DirectoryName "*.dll") (Split-Path $appPath) -Force
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:LIBGL_ALWAYS_SOFTWARE = "1"
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $logPath) { Get-Content $logPath | Write-Host }
            throw "Installed app exited during Windows VM smoke test"
          }
          if ($app.MainWindowHandle -eq 0) {
            Stop-Process -Id $app.Id -Force
            if (Test-Path $logPath) { Get-Content $logPath | Write-Host }
            throw "Molecula remained running but did not create a main window"
          }
          Stop-Process -Id $app.Id -Force
  release:
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Molecula $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/Molecula-Windows-Setup.exe --clobber
